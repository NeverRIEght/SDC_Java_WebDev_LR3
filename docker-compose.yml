name: Webapp
services:
  app:
    container_name: ${APP_NAME}
    build: .
    env_file:
      - .env
    ports:
      - "${APP_EXTERNAL_PORT}:${APP_INTERNAL_PORT}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
  postgres:
    container_name: postgres
    image: postgres:latest
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_EXTERNAL_PORT}:${DB_INTERNAL_PORT}"
    restart: unless-stopped
    volumes:
      - ./database/schema:/docker-entrypoint-initdb.d
      - ./database/data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready --username=${DB_USER} --dbname=${DB_NAME}" ]
      interval: 5s
      timeout: 40s
      retries: 10
  minio:
    container_name: ${OS_HOSTNAME}
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    ports:
      - "${OS_EXTERNAL_PORT}:${OS_INTERNAL_PORT}"
      - "${OS_CONSOLE_EXTERNAL_PORT}:${OS_CONSOLE_INTERNAL_PORT}"
    volumes:
      - ./storage/minio:/data
    environment:
      MINIO_ROOT_USER: "${OBJECT_STORAGE_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${OBJECT_STORAGE_SECRET_KEY}"
    command: server --console-address ":${OS_CONSOLE_INTERNAL_PORT}" /data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail http://localhost:${OS_CONSOLE_INTERNAL_PORT}/minio/health/live || exit 1" ]
      interval: 5s
      timeout: 40s
      retries: 10